DEAP_configuration:
  name: NKR
  data_instance: data/D2_cdm/OMOP_NKR_CS10
  database_path: data/D2_cdm/d2.duckdb
  data_model: OMOP
prepare_db_omop:
  cdm_metadata: transformations/common_configuration/CDM_metadata.rds
  auxiliary_functions: transformations/common_functionality/functions/move_table_schema.R
  database_loader_config: configuration/config_set_db.json
  output: data/D2_cdm/d2.duckdb
set_db_omop:
  cdm_metadata: transformations/common_configuration/CDM_metadata.rds
  auxiliary_functions: transformations/common_functionality/functions/move_table_schema.R
  database_loader_config: configuration/config_set_db.json
  output: data/D2_cdm/d2.duckdb
create_simple_concepts_omop:
  since_when_data_complete: transformations/T2_semantic_harmonization/intermediate_data_file/since_when_data_complete.rds
  d3_spells: data/D3_study_variables/D3_SPELLS.parquet
create_complex_concepts:
  spells_dir: data/D3_study_variables/D3_SPELLS.parquet
  input_dir: data/D3_study_variables/D3_CONCEPTS_parquet
  # output_dir: transformations/T2_semantic_harmonization/intermediate_data_file/complex_concepts
  output_dir: data/D3_study_variables/D3_CONCEPTS_parquet
  concept_meaning: transformations/common_configuration/RWE-BRIDGE/concept_meaning.csv
  functions: transformations/T2_semantic_harmonization/source_code/functions
process_persons:
  persons: data/D2_cdm/d2.duckdb
  cdm_source: data/D2_cdm/d2.duckdb
  source_file: ~
  output_persons: transformations/T2_semantic_harmonization/intermediate_data_file
process_observation_periods:
  D3_person_file: data/D3_study_variables/D3_PERSONS.parquet
  observation_periods_file: data/D2_cdm/d2.duckdb
get_counts_all_concepts: ~
episodes_and_eligibility:
  d3_spells: data/D3_study_variables/D3_SPELLS.parquet
  d3_rsvproducts: data/D3_study_variables/d3_rsvproducts.parquet
  d3_all_concepts: data/D3_study_variables/D3_CONCEPTS_parquet
  d3_univariate_episodes: data/D3_study_variables/D3_UNIVARIATE_EPISODES_parquet
  d3_multivariate_episodes: data/D3_study_variables/D3_MULTIVARIATE_EPISODES.parquet
  source_info: ~
studyvariables_anchored:
  d3_all_concepts: data/D3_study_variables/D3_CONCEPTS_parquet
  d3_eligibility: data/D3_study_variables/D3_ELIGIBILITY.parquet
  output_anchoring: data/D4_analytic_datasets/D4_STUDYVARIABLES_ANCHORED.parquet
studyvariables_anchored_temp: ~
create_population_vaccinated: ~
create_D5_table1_1: ~
create_D5_table1_2: ~
create_D5_figure1: ~
create_D6_table1_1: ~
create_D6_table1_2: ~
run_hash_log_export: ~

outputs:
  dir_d3: data/D3_study_variables
  dir_d4: data/D4_analytic_datasets
  dir_d5: data/D5_results
  dir_d6: data/D6_report

